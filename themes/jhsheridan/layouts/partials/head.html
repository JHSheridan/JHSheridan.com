{{- $title := cond .IsHome site.Title (printf "%s | %s" .Title site.Title) -}}
{{- $description := .Params.description | default site.Params.metaDescription -}}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{ $title }}</title>
<meta name="description" content="{{ $description }}">
<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:type" content="{{ cond .IsPage "article" "website" }}">
{{- with .Date }}
<meta property="article:published_time" content="{{ .Format "2006-01-02T15:04:05-07:00" }}">
{{- end }}

{{ partialCached "head/css.html" . }}
